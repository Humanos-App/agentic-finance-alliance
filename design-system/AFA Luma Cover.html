<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AFA — Luma cover</title>
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#5E6B63;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.cover{width:1200px;height:1200px;flex:none;position:relative;overflow:hidden;background:#12241D;color:#F1EDE3;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding-bottom:207px;box-sizing:border-box}
.center{text-align:center;padding:0 84px;display:flex;flex-direction:column;align-items:center}
.mark{width:92px;height:92px;display:block}
.kicker{margin-top:40px;font-size:26px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#A9C3B5}
.center h1{margin:32px 0 0;font-size:132px;font-weight:600;line-height:1.02;letter-spacing:-.04em}
.div{width:88px;height:1px;background:rgba(241,237,227,.34);margin:38px 0}
.sub{margin:0;font-size:38px;font-weight:500;line-height:1.4;letter-spacing:.01em;color:#D6DCD3}
.sponsors{position:absolute;left:0;right:0;bottom:88px;display:flex;flex-direction:column;align-items:center;gap:30px}
.sponsors .lbl{font-size:19px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:rgba(169,195,181,.7)}
.sponsors .row{display:flex;align-items:center;justify-content:center;gap:64px}
.sponsors img{display:block}
</style></head><body>
<div class="cover">
  <div class="center">
    <img class="mark" src="assets/logo-toasted-transparent.png" alt="AFA">
    <div class="kicker">A Private Dinner</div>
    <h1>Agentic Finance Alliance</h1>
    <div class="div"></div>
    <p class="sub">For Leaders in Payments, Finance, Insurtech and AI</p>
  </div>
  <div class="sponsors">
    <div class="lbl">Sponsored by</div>
    <div class="row">
      <img src="assets/logos/crossmint-onDark.png" alt="Crossmint" style="height:42px">
      <img src="assets/logos/sponsor-wordmark-light.svg" alt="Sponsor" style="height:60px">
    </div>
  </div>
</div>
</body></html>
