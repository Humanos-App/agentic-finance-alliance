<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentic Finance Alliance · Private dinners at the frontier of AI and finance</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;overflow-x:hidden;background:var(--afa-cream)}
h1,h2,h3,p{margin:0;text-wrap:pretty}
a{color:var(--afa-green);text-decoration:none}a:hover{color:var(--afa-green-bright)}
.v2-wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.v2-eb{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--afa-green-bright)}
.v2-eb-soft{color:var(--afa-on-green-soft)}
.v2-num{font-family:var(--font-mono);font-size:13px;color:var(--afa-green-bright)}
.v2-h2{margin-top:16px;font-size:clamp(34px,4.6vw,56px);font-weight:600;letter-spacing:-.035em;line-height:1.02;color:var(--afa-green)}
.v2-lede{margin-top:16px;font-size:18px;color:var(--text-muted);max-width:44ch}
.v2-sec{padding:clamp(72px,12vh,128px) 0}
.v2-sec-rule{border-top:1px solid var(--border-hairline)}
/* buttons */
.v2-btn{display:inline-flex;align-items:center;font:inherit;font-size:15px;font-weight:500;letter-spacing:-.01em;padding:12px 24px;border-radius:9999px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:opacity var(--dur-base) var(--ease-standard),background var(--dur-base) var(--ease-standard)}
.v2-btn:hover{opacity:var(--hover-opacity)}.v2-btn:active{transform:scale(var(--press-scale))}
.v2-btn:disabled{opacity:.4;pointer-events:none}
.v2-btn-lg{font-size:16px;padding:14px 28px}
.v2-btn-cream{background:var(--afa-cream);color:var(--afa-green)}.v2-btn-cream:hover{color:var(--afa-green)}
.v2-btn-green{background:var(--afa-green);color:var(--afa-cream)}.v2-btn-green:hover{color:var(--afa-cream)}
.v2-btn-line{background:transparent;border-color:rgba(241,237,227,.6);color:var(--afa-cream)}.v2-btn-line:hover{color:var(--afa-cream)}
/* nav */
.v2-nav{position:fixed;top:0;left:0;right:0;z-index:30;color:var(--afa-cream);transition:background var(--dur-slow) var(--ease-standard),border-color var(--dur-slow) var(--ease-standard);border-bottom:1px solid transparent}
.v2-nav.is-solid{background:var(--afa-cream);color:var(--afa-green);border-bottom-color:var(--border-hairline)}
.v2-nav-in{display:flex;align-items:center;gap:28px;height:72px}
.v2-brand{display:flex;align-items:center;gap:12px;color:inherit;font-weight:600;letter-spacing:-.02em}.v2-brand:hover{color:inherit}
.v2-links{display:flex;gap:28px;margin-left:auto;font-size:15px;font-weight:500}
.v2-links a{color:inherit;opacity:.85}.v2-links a:hover{opacity:1;color:inherit}
/* hero */
.v2-hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:var(--afa-green);color:var(--afa-cream)}
.v2-hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v2-hero-tint{position:absolute;inset:0;background:rgba(20,52,43,.62)}
.v2-hero-in{position:relative;width:100%;padding-top:140px;padding-bottom:clamp(56px,10vh,110px)}
.v2-h1{margin-top:0;max-width:13ch;font-size:clamp(52px,8.4vw,124px);font-weight:600;line-height:.96;letter-spacing:-.045em}
.v2-hero-sub{margin-top:22px;max-width:52ch;font-size:clamp(17px,1.6vw,20px);opacity:.88}
/* logos */
.v2-logos-band{padding:44px 0;border-bottom:1px solid var(--border-hairline)}
.v2-logos{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:28px 40px;margin-top:26px}
.v2-logos img{display:block;width:auto;flex:none}
/* about */
.v2-about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:32px}
.v2-statement{font-size:clamp(26px,3.4vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.12;color:var(--afa-green)}
.v2-statement{max-width:22ch}
.v2-about-pts{margin-top:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--border-hairline)}
.v2-about-pts>div{padding:20px 20px 0 0}
.v2-about-pts>div+div{border-left:1px solid var(--border-hairline);padding-left:20px}
.v2-about-pts b{display:block;font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--afa-green)}
.v2-about-pts p{margin-top:6px;font-size:16px;color:var(--text-muted)}
@media (max-width:640px){.v2-about-pts{grid-template-columns:minmax(0,1fr)}.v2-about-pts>div+div{border-left:0;padding-left:0;border-top:1px solid var(--border-hairline)}.v2-about-pts>div{padding-bottom:16px}}
.v2-punch{position:relative;overflow:hidden;min-height:calc(75 * clamp(6px,0.85vw,11px) + 80px);display:flex;align-items:center;padding:40px 0;border-top:1px solid var(--border-hairline);text-align:center}.v2-punch>.v2-wrap{width:100%}
.v2-punch-l{display:block;white-space:nowrap}.v2-punch-l+.v2-punch-l{margin-top:.55em}
.v2-punch h2{font-size:clamp(18px,3.9vw,52px);font-weight:600;letter-spacing:-.04em;line-height:1.04;color:var(--afa-green)}
.v2-ledger{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;font-family:var(--font-mono);font-size:clamp(6px,0.85vw,11px);line-height:1;white-space:pre;color:var(--ledger-ink);opacity:.2;pointer-events:none;user-select:none}
/* how */
.v2-steps{margin-top:56px;display:flex;flex-direction:column;gap:clamp(48px,8vh,88px)}
.v2-step{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.v2-step.is-flip .v2-step-media{order:2}
.v2-step-media{aspect-ratio:4/3;border-radius:var(--radius-card);overflow:hidden;background:var(--afa-cream-deep)}
.v2-step-media img{width:100%;height:100%;object-fit:cover;display:block}
.v2-step-media:has(.v2-match){aspect-ratio:auto}
.v2-step-txt h3{margin-top:10px;font-size:clamp(26px,3vw,36px);font-weight:600;letter-spacing:-.03em;color:var(--afa-green)}
.v2-step-txt p{margin-top:14px;font-size:18px;color:var(--text-muted);max-width:42ch}
.v2-match{height:100%;background:var(--afa-green);color:var(--afa-cream);padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;justify-content:center;gap:0}
.v2-match-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--afa-on-green-soft);padding-bottom:14px;border-bottom:1px solid var(--border-inverse)}
.v2-match-r{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--border-inverse);font-size:14px}
.v2-match-r code{font-family:var(--font-mono);font-size:13px;color:var(--afa-on-green-soft)}
.v2-match-r b{font-weight:600;font-size:13px}
/* who */
.v2-who{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border-hairline)}
.v2-who>div{padding:28px 22px 0 0}
.v2-who>div+div{border-left:1px solid var(--border-hairline);padding-left:22px}
.v2-who h3{font-size:clamp(26px,2.8vw,36px);font-weight:600;letter-spacing:-.03em;color:var(--afa-green)}
.v2-who p{margin-top:10px;font-size:16px;color:var(--text-muted)}
/* gallery */
.v2-gallery-h{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.v2-gallery{margin-top:40px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.v2-gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:14px;background:var(--afa-cream-deep)}
.v2-gallery img:nth-child(4n+2),.v2-gallery img:nth-child(4n+4){margin-top:36px}
/* dinners */
.v2-dinners{margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.v2-dinner{position:relative;border-radius:var(--radius-card);overflow:hidden;background:var(--afa-cream-deep);display:flex;flex-direction:column}
.v2-dinner img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.v2-dinner.is-next img{object-position:50% 0}
.v2-dinner-txt{padding:26px 28px 30px}
.v2-dinner.is-next{background:var(--afa-green);color:var(--afa-cream)}
.v2-dinner-txt h3{margin-top:10px;font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1}
.v2-dinner-txt p{margin:10px 0 0;font-size:16px;color:var(--text-muted)}
.v2-dinner.is-next .v2-dinner-txt p{color:var(--afa-on-green-soft);margin-bottom:22px}
.v2-dinner.is-next h3{color:var(--afa-cream)}
.v2-dinner h3{color:var(--afa-green)}
.v2-tag{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--afa-green-bright)}
.v2-dinner.is-next .v2-tag{color:var(--afa-on-green-soft)}
/* partners */
.v2-partners{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(32px,6vw,80px);align-items:start}
.v2-contact{margin-top:32px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.v2-contact b{font-weight:600;font-size:17px}.v2-contact span{color:var(--text-muted);margin-bottom:8px}
.v2-get{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.v2-get>div{background:var(--afa-cream-deep);border-radius:var(--radius-card);padding:24px 26px}
.v2-get b{display:block;margin-top:10px;font-size:19px;font-weight:600;letter-spacing:-.015em;color:var(--afa-green)}
.v2-get p{margin-top:6px;font-size:15px;color:var(--text-muted)}
/* apply */
.v2-apply{background:var(--afa-green);color:var(--afa-cream);padding:clamp(80px,13vh,140px) 0}
.v2-apply-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,80px);align-items:start}
.v2-apply h2{margin-top:16px;font-size:clamp(32px,4.2vw,52px);font-weight:600;letter-spacing:-.035em;line-height:1.04}
.v2-apply-in>div>p{margin-top:18px;font-size:18px;color:var(--afa-on-green-soft);max-width:44ch}
.v2-form{display:flex;flex-direction:column;gap:12px}
.v2-form input,.v2-form textarea{font:inherit;font-size:16px;padding:14px 20px;border-radius:9999px;border:1px solid var(--border-inverse);background:rgba(241,237,227,.06);color:var(--afa-cream);outline:none}
.v2-form textarea{border-radius:var(--radius-card);min-height:110px;resize:vertical}
.v2-form input:focus,.v2-form textarea:focus{border-color:var(--afa-on-green-soft)}
.v2-form ::placeholder{color:var(--afa-on-green-soft);opacity:.85}
.v2-form>.v2-btn{align-self:flex-start;margin-top:6px}
.v2-roles{display:flex;gap:8px;flex-wrap:wrap}
.v2-roles button{font:inherit;font-size:15px;padding:10px 18px;border-radius:9999px;border:1px solid var(--border-inverse);background:transparent;color:var(--afa-cream);cursor:pointer}
.v2-roles button.is-on{background:var(--afa-cream);color:var(--afa-green);border-color:var(--afa-cream)}
.v2-sent{background:rgba(241,237,227,.06);border:1px solid var(--border-inverse);border-radius:var(--radius-card);padding:30px 32px}
.v2-sent b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.v2-sent p{color:var(--afa-on-green-soft);margin:4px 0 18px}
/* footer */
.v2-footer{background:var(--afa-green);color:var(--afa-cream);border-top:1px solid var(--border-inverse);padding:40px 0}
.v2-footer-in{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.v2-footer-links{display:flex;gap:24px;flex-wrap:wrap;font-size:14px}
.v2-footer a{color:var(--afa-cream);opacity:.78}.v2-footer a:hover{opacity:1;color:var(--afa-cream)}
@media (max-width:960px){.v2-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.v2-gallery img:nth-child(n){margin-top:0}.v2-gallery img:nth-child(2n){margin-top:28px}.v2-links{display:none}.v2-nav-in{justify-content:space-between}.v2-about,.v2-step,.v2-partners,.v2-apply-in{grid-template-columns:minmax(0,1fr)}.v2-step.is-flip .v2-step-media{order:0}.v2-who{grid-template-columns:repeat(2,minmax(0,1fr))}.v2-who>div:nth-child(3){border-left:0;padding-left:0}.v2-who>div{padding-bottom:24px}.v2-logos{justify-content:center}}
@media (max-width:640px){.v2-brand span{display:none}.v2-dinners,.v2-get{grid-template-columns:minmax(0,1fr)}.v2-who{grid-template-columns:minmax(0,1fr)}.v2-who>div+div{border-left:0;padding-left:0;border-top:1px solid var(--border-hairline)}.v2-match-r{grid-template-columns:minmax(0,1fr) auto}.v2-match-r span{display:none}}</style>
