<!-- @dsCard group="Brand" viewport="700x320" name="Ledger texture" subtitle="The A mark filled with transaction code, behind the type" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
</style></head><body><div style="display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:center">
<img src="../assets/cover-ledger-london.png" alt="London cover with ledger A" style="width:280px;height:280px;display:block;border-radius:14px;border:1px solid var(--border-hairline)">
<div style="font-size:13px;line-height:1.5">
<div style="display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted);white-space:nowrap">Shape</span><b style="font-weight:600;text-align:right">the A mark, at full bleed</b></div><div style="display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted);white-space:nowrap">Fill</span><b style="font-weight:600;text-align:right">monospace transaction text: hashes, amounts, agent ids, approved / declined</b></div><div style="display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted);white-space:nowrap">Colour</span><b style="font-weight:600;text-align:right">bright green #2E6B52</b></div><div style="display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted);white-space:nowrap">Opacity</span><b style="font-weight:600;text-align:right">.2 — texture, never a headline</b></div><div style="display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted);white-space:nowrap">On top</span><b style="font-weight:600;text-align:right">title in deep green, centred, 600</b></div><div style="display:flex;justify-content:space-between;gap:14px;padding:6px 0;"><span style="color:var(--text-muted);white-space:nowrap">Use</span><b style="font-weight:600;text-align:right">covers, banners, hero areas. One per surface.</b></div>
</div></div></body></html>
