<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.row{display:flex;gap:12px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted)}
.tsp{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--border-hairline)}
.tsp:last-child{border-bottom:0}.lbl{font-size:12.5px;color:var(--text-muted);white-space:nowrap;font-family:var(--font-mono)}
</style></head><body><div class="g4">
<div class="sw"><div style="background:#F1EDE3;display:flex;align-items:center;justify-content:center;height:92px"><img src="../assets/logo-green-on-toasted.png" style="width:60px;height:60px;display:block"></div><div class="m"><b style="font-weight:500;font-size:12px">green on toasted</b></div></div><div class="sw"><div style="background:#F1EDE3;display:flex;align-items:center;justify-content:center;height:92px"><img src="../assets/logo-black-on-toasted.png" style="width:60px;height:60px;display:block"></div><div class="m"><b style="font-weight:500;font-size:12px">black on toasted</b></div></div><div class="sw"><div style="background:#12241D;display:flex;align-items:center;justify-content:center;height:92px"><img src="../assets/logo-toasted-on-black.png" style="width:60px;height:60px;display:block"></div><div class="m"><b style="font-weight:500;font-size:12px">toasted on black</b></div></div><div class="sw"><div style="background:#E8E3D6;display:flex;align-items:center;justify-content:center;height:92px"><img src="../assets/logo-green-transparent.png" style="width:60px;height:60px;display:block"></div><div class="m"><b style="font-weight:500;font-size:12px">transparent</b></div></div>
