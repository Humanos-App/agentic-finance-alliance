<!-- @dsCard group="Brand" viewport="700x170" name="Interaction states" subtitle="Opacity on hover, a hair of scale on press" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.row{display:flex;gap:12px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted)}
.tsp{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--border-hairline)}
.tsp:last-child{border-bottom:0}.lbl{font-size:12.5px;color:var(--text-muted);white-space:nowrap;font-family:var(--font-mono)}
</style></head><body><div class="row" style="gap:16px;align-items:center">
<div style="padding:13px 26px;border-radius:9999px;background:var(--accent);color:var(--on-accent);font-weight:500">rest</div>
<div style="padding:13px 26px;border-radius:9999px;background:var(--accent);color:var(--on-accent);font-weight:500;opacity:.86">hover · .86 opacity</div>
<div style="padding:13px 26px;border-radius:9999px;background:var(--accent);color:var(--on-accent);font-weight:500;transform:scale(.985)">press · scale .985</div>
<div style="padding:13px 26px;border-radius:9999px;background:var(--accent);color:var(--on-accent);font-weight:500;opacity:.4">disabled · .4</div>
</div>
<div class="mono" style="margin-top:14px">200ms · cubic-bezier(.2,.6,.2,1). Fades and opacity only — no bounce, no colour shift.</div></body></html>
