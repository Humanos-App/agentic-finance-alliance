<!-- @dsCard group="Colors" viewport="700x150" name="Two greens" subtitle="Deep green for type and fills, bright green for accents and texture" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
</style></head><body><div class="g4"><div class="sw"><div class="chip" style="background:#14342B"></div><div class="m"><b>Deep green</b><span>#14342B</span></div></div><div class="sw"><div class="chip" style="background:#2E6B52"></div><div class="m"><b>Bright green</b><span>#2E6B52</span></div></div><div class="sw"><div class="chip" style="background:#A9C3B5"></div><div class="m"><b>Soft green</b><span>#A9C3B5</span></div></div><div class="sw"><div class="chip" style="background:#5E6B63"></div><div class="m"><b>Muted</b><span>#5E6B63</span></div></div></div></body></html>
