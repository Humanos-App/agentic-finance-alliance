<!-- @dsCard group="Colors" viewport="700x150" name="Cream ground" subtitle="Warm cream, never pure white" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}
</style></head><body><div class="g4"><div class="sw"><div class="chip" style="background:#F1EDE3"></div><div class="m"><b>Cream</b><span>#F1EDE3</span></div></div><div class="sw"><div class="chip" style="background:#E8E3D6"></div><div class="m"><b>Cream deep</b><span>#E8E3D6</span></div></div><div class="sw"><div class="chip" style="background:#E0DACE"></div><div class="m"><b>Line</b><span>#E0DACE</span></div></div><div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="m"><b>Not this</b><span>#FFFFFF</span></div></div></div></body></html>
