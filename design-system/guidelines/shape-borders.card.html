<!-- @dsCard group="Spacing" viewport="700x160" name="Borders & elevation" subtitle="Hairlines only — the brand has no shadow system" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.row{display:flex;gap:12px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted)}
.tsp{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--border-hairline)}
.tsp:last-child{border-bottom:0}.lbl{font-size:12.5px;color:var(--text-muted);white-space:nowrap;font-family:var(--font-mono)}
</style></head><body><div class="row" style="gap:16px">
<div style="flex:1;border:1px solid var(--border-hairline);border-radius:14px;padding:16px"><b style="font-size:14px">1px hairline</b><div class="mono" style="margin-top:5px">--afa-line #E0DACE</div></div>
<div style="flex:1;border:1.5px solid var(--text-body);border-radius:9999px;padding:16px;text-align:center"><b style="font-size:14px">1.5px ghost</b></div>
<div style="flex:1;background:var(--surface-card);border-radius:14px;padding:16px"><b style="font-size:14px">Tone, not shadow</b><div class="mono" style="margin-top:5px">surface on canvas</div></div>
</div></body></html>
