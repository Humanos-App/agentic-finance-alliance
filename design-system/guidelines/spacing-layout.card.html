<!-- @dsCard group="Spacing" viewport="700x200" name="Layout rules" subtitle="As used on the AFA website" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.row{display:flex;gap:12px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted)}
.tsp{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--border-hairline)}
.tsp:last-child{border-bottom:0}.lbl{font-size:12.5px;color:var(--text-muted);white-space:nowrap;font-family:var(--font-mono)}
</style></head><body><div style="background:var(--surface-card);border-radius:14px;padding:20px 22px;font-size:14px">
<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted)">Grid</span><b style="font-weight:600">single column, centred</b></div><div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted)">Max width</span><b style="font-weight:600">1200px</b></div><div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted)">Gutter</span><b style="font-weight:600">clamp(20px, 4vw, 48px)</b></div><div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted)">Section rhythm</span><b style="font-weight:600">clamp(72px, 12vh, 128px)</b></div><div style="display:flex;justify-content:space-between;padding:7px 0;"><span style="color:var(--text-muted)">Rhythm base</span><b style="font-weight:600">8px</b></div>
</div></body></html>
