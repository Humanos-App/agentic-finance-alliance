<!-- @dsCard group="Spacing" viewport="700x150" name="Scale" subtitle="8px rhythm base" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--surface-canvas);color:var(--text-body);font-family:var(--font-sans)}
.row{display:flex;gap:12px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:var(--radius-swatch);overflow:hidden;border:1px solid var(--border-hairline)}
.chip{height:72px}.m{padding:9px 11px}.m b{display:block;font-size:13px;font-weight:600}.m span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted)}
.tsp{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--border-hairline)}
.tsp:last-child{border-bottom:0}.lbl{font-size:12.5px;color:var(--text-muted);white-space:nowrap;font-family:var(--font-mono)}
</style></head><body><div class="row" style="align-items:flex-end">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">16</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">32</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">64</div></div><div style="text-align:center"><div style="width:96px;height:96px;background:var(--accent);border-radius:3px"></div><div class="mono" style="margin-top:6px">96</div></div>
</div></body></html>
